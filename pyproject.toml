[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "gulliver-behaviour-classifier"
version = "0.1.1"
description = "Classify gull behaviour from Movebank sensor data"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "Fatemeh Karimi Nejadasl"}]
dependencies = [
    "numpy>=1.23",
    "pandas>=2.0",
    # runs the trained classifier. The CPU wheel is enough:
    # pip install torch --index-url https://download.pytorch.org/whl/cpu
    "torch>=2.0",
]

[project.optional-dependencies]
test = [
    "black",
    "isort",
    "pyflakes",
    "pytest",
]

[project.scripts]
gulliver-classify = "gulliver.cli:main"

[tool.setuptools.packages.find]
include = ["gulliver*"]

# the trained weights ship with the package
[tool.setuptools.package-data]
gulliver = ["models/*.pth"]

# testing extras
# pip install .[test]
[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.black]
target-version = ["py314"]

# for linters
# for i in gulliver tests;do echo $i; black $i -l 88; isort $i --profile black; pyflakes $i;done
