[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "gulliver-behavior-classifier"
version = "0.1.0"
description = "Classify gull behaviour from Movebank sensor data"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "Fatemeh Karimi Nejadasl"}]
dependencies = [
    "numpy>=1.23",
    "pandas>=2.0",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["gulliver*"]

# testing extras
# pip install .[test]
[tool.pytest.ini_options]
testpaths = ["tests"]

